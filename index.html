<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITech 모니터링 피드</title>
<style>
  @font-face { font-family:'Pretendard'; font-weight:400;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2'); }
  @font-face { font-family:'Pretendard'; font-weight:600;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2'); }
  @font-face { font-family:'Pretendard'; font-weight:700;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0e14; color:#f2f3f6; font-family:'Pretendard',-apple-system,sans-serif; }
  header {
    position: sticky; top:0; z-index:10; background:rgba(11,14,20,0.92); backdrop-filter: blur(8px);
    border-bottom:1px solid #22273a; padding:18px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-badge { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#60a5fa,#5eead4);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#0b0e14; font-size:15px; }
  .brand-name { font-weight:700; font-size:17px; }
  .brand-sub { font-size:12px; color:#8b93aa; }
  main { max-width:720px; margin:0 auto; padding:24px 12px 60px; }

  .control-bar {
    position: sticky; top: 71px; z-index: 9; background: rgba(11,14,20,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #22273a; padding: 10px 12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .filter-row { display:flex; align-items:center; gap:8px; position:relative; }
  .search-row { display:flex; align-items:center; gap:8px; }
  .pill-btn {
    flex: 0 0 auto; font-size:13px; font-weight:600; color:#8b93aa; background:#161b28;
    border:1px solid #262c3f; padding:7px 14px; border-radius:999px; cursor:pointer;
    white-space:nowrap; transition: all .15s ease;
  }
  .pill-btn:hover { color:#d7dae4; border-color:#3a4258; }
  .pill-btn.active {
    color:#0b0e14; background:linear-gradient(135deg,#60a5fa,#5eead4); border-color:transparent;
  }
  #search-input {
    flex:1; min-width:0; background:#161b28; border:1px solid #262c3f; border-radius:999px;
    padding:8px 14px; color:#f2f3f6; font-family:inherit; font-size:13px;
  }
  #search-input:focus { outline:none; border-color:#5eead4; }
  #search-clear { display:none; }

  .status-msg { text-align:center; color:#8b93aa; font-size:13px; padding:32px 12px; }
  .status-msg.error { color:#f87171; }

  /* 달력 팝업 */
  .calendar-popup {
    display:none; position:fixed; top:132px; left:50%; transform:translateX(-50%); z-index:30;
    width:300px; max-width:92vw; background:#141a2b; border:1px solid #262c3f; border-radius:16px;
    padding:16px; box-shadow:0 24px 60px rgba(0,0,0,0.55);
  }
  .calendar-popup.active { display:block; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; font-weight:700; font-size:14px; }
  .cal-nav { cursor:pointer; color:#8b93aa; padding:4px 12px; border-radius:8px; user-select:none; }
  .cal-nav:hover { background:#1c2233; color:#fff; }
  .cal-nav.disabled { visibility:hidden; }
  .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:#565d74; margin-bottom:6px; }
  .cal-days { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12px;
    border-radius:8px; color:#333a4d; }
  .cal-day.has-data { color:#d7dae4; background:#1c2233; cursor:pointer; font-weight:600; }
  .cal-day.has-data:hover { background:#262c3f; }
  .cal-day.selected { background:linear-gradient(135deg,#60a5fa,#5eead4); color:#0b0e14; }
  .cal-footer { margin-top:10px; text-align:center; }
  .cal-footer button {
    background:none; border:none; color:#8b93aa; font-size:12px; cursor:pointer; text-decoration:underline;
  }

  .day-block { margin-bottom: 44px; }
  .day-header {
    display:flex; align-items:center; gap:10px; margin: 0 4px 14px;
  }
  .day-date { font-size:20px; font-weight:700; }
  .day-count { font-size:12px; color:#8b93aa; background:#161b28; border:1px solid #262c3f;
    padding:4px 10px; border-radius:999px; }

  .quote-card {
    background: linear-gradient(135deg,#141a2b,#0d1220); border:1px solid #232a40; border-radius:18px;
    padding:22px 22px; margin: 0 4px 14px;
  }
  .quote-card p { font-size:14px; line-height:1.6; color:#d7dae4; margin:0 0 8px; }
  .quote-card span { font-size:12px; color:#5eead4; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .cell { position:relative; aspect-ratio:4/5; overflow:hidden; cursor:pointer; background:#161b28; }
  .cell img { width:100%; height:100%; object-fit:cover; transition:transform .2s ease; }
  .cell:hover img { transform:scale(1.04); }
  .cell.text-fallback { display:flex; align-items:center; justify-content:center; padding:10px; text-align:center; }
  .cell.text-fallback p { font-size:11px; line-height:1.4; color:#c3c8d6; margin:0; }
  .tag { position:absolute; top:8px; left:8px; font-size:10px; padding:3px 8px; border-radius:999px;
    background:rgba(0,0,0,0.55); color:#fff; font-weight:600; backdrop-filter: blur(2px); }
  .date-badge { position:absolute; bottom:8px; left:8px; font-size:10px; padding:3px 8px; border-radius:999px;
    background:rgba(0,0,0,0.55); color:#5eead4; font-weight:600; backdrop-filter: blur(2px); }

  /* 라이트박스 */
  .lightbox { display:none; position:fixed; inset:0; background:rgba(4,6,10,0.92); z-index:50;
    align-items:center; justify-content:center; padding:24px; }
  .lightbox.active { display:flex; }
  .lightbox-inner { max-width:420px; width:100%; }
  .lightbox-inner img { width:100%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:block; }
  .lightbox-placeholder {
    width:100%; aspect-ratio:4/5; border-radius:14px; background:#161b28; border:1px solid #262c3f;
    display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
    color:#c3c8d6; font-size:15px; line-height:1.6;
  }
  .lightbox .close { position:absolute; top:20px; right:24px; font-size:28px; color:#fff; cursor:pointer;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
  .lightbox-info { margin-top:16px; text-align:center; }
  .lightbox-info p { font-size:14px; color:#d7dae4; line-height:1.5; margin:0 0 14px; }
  .lightbox-meta { font-size:12px; color:#8b93aa; margin-bottom:14px; }
  .lightbox-btn { display:inline-block; background:linear-gradient(135deg,#60a5fa,#5eead4); color:#0b0e14;
    font-weight:700; font-size:13px; padding:11px 22px; border-radius:999px; text-decoration:none; }

  #scroll-sentinel { height:1px; }
  footer { text-align:center; color:#565d74; font-size:12px; padding:30px 0; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">M</div>
    <div>
      <div class="brand-name">MITech 모니터링</div>
      <div class="brand-sub">전략기획팀 데일리 브리핑</div>
    </div>
  </div>
  <div class="day-count" id="total-count"></div>
</header>

<nav class="control-bar">
  <div class="filter-row">
    <button class="pill-btn active" id="all-btn">전체</button>
    <button class="pill-btn" id="calendar-toggle">📅 날짜 선택</button>
  </div>
  <div class="search-row">
    <input type="text" id="search-input" placeholder="제목 키워드 검색 (예: 스텐트, FDA)">
    <button class="pill-btn" id="search-btn">검색</button>
    <button class="pill-btn" id="search-clear">✕</button>
  </div>
</nav>

<div class="calendar-popup" id="calendar-popup">
  <div class="cal-head">
    <span class="cal-nav" id="cal-prev">‹</span>
    <span id="cal-month-label"></span>
    <span class="cal-nav" id="cal-next">›</span>
  </div>
  <div class="cal-weekdays">
    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>
  <div class="cal-days" id="cal-days"></div>
  <div class="cal-footer"><button id="cal-close">닫기</button></div>
</div>

<main>
  <div id="feed"></div>
  <div id="scroll-sentinel"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="close" id="lightbox-close">✕</div>
    <div id="lightbox-media"></div>
    <div class="lightbox-info">
      <p id="lightbox-title"></p>
      <div class="lightbox-meta" id="lightbox-meta"></div>
      <a id="lightbox-link" class="lightbox-btn" href="#" target="_blank" rel="noopener">원문 기사로 이동 →</a>
    </div>
  </div>
</div>

<footer>MITech 전략기획팀 · 사내 공유용 · 매일 자동 업데이트</footer>

<script>
// ══════════════════════════════════════════════════════════════
// 데이터 소스: data/index.json (매니페스트) + data/<date>.json (일자별)
// 매일 업데이트는 data/<오늘날짜>.json 파일과 cards/<오늘날짜>/ 이미지 폴더를
// 추가하고 data/index.json에 오늘 날짜 한 줄만 추가하면 됩니다.
// ══════════════════════════════════════════════════════════════

const INITIAL_BATCH = 2;
const DATA_DIR = 'data';

const feed = document.getElementById('feed');
const totalCountEl = document.getElementById('total-count');
const sentinel = document.getElementById('scroll-sentinel');
const allBtn = document.getElementById('all-btn');
const calendarToggle = document.getElementById('calendar-toggle');
const calendarPopup = document.getElementById('calendar-popup');
const calMonthLabel = document.getElementById('cal-month-label');
const calDaysEl = document.getElementById('cal-days');
const calPrev = document.getElementById('cal-prev');
const calNext = document.getElementById('cal-next');
const calClose = document.getElementById('cal-close');
const searchInput = document.getElementById('search-input');
const searchBtn = document.getElementById('search-btn');
const searchClear = document.getElementById('search-clear');

const lightbox = document.getElementById('lightbox');
const lightboxMedia = document.getElementById('lightbox-media');
const lightboxTitle = document.getElementById('lightbox-title');
const lightboxMeta = document.getElementById('lightbox-meta');
const lightboxLink = document.getElementById('lightbox-link');
const lightboxClose = document.getElementById('lightbox-close');

let manifest = { total: 0, days: [] };
let manifestDateSet = new Set();
let dayCache = new Map();
let mode = 'all';            // 'all' | 'single' | 'search'
let loadedIndex = 0;
let selectedDate = '';
let calendarView = { year: 2026, month: 1 };

function dotDate(dashDate) { return dashDate.replaceAll('-', '.'); }

function showStatus(msg, isError = false) {
  feed.innerHTML = `<div class="status-msg${isError ? ' error' : ''}">${msg}</div>`;
}

async function fetchJSON(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path} (${res.status})`);
  return res.json();
}

async function fetchDay(date) {
  if (dayCache.has(date)) return dayCache.get(date);
  const data = await fetchJSON(`${DATA_DIR}/${date}.json`);
  dayCache.set(date, data);
  return data;
}

// ── 카드 셀 렌더링 (일반 피드 + 검색 결과 공용) ────────────────
function buildCell(it, { showDateBadge = false } = {}) {
  const cell = document.createElement('div');
  const dateBadge = showDateBadge && it.date ? `<span class="date-badge">${dotDate(it.date)}</span>` : '';

  if (it.file) {
    cell.className = 'cell';
    cell.innerHTML = `<span class="tag">${it.tag || ''}</span>${dateBadge}<img src="${it.file}" loading="lazy" alt="${it.title || ''}">`;
    const img = cell.querySelector('img');
    img.onerror = () => {
      cell.className = 'cell text-fallback';
      cell.innerHTML = `<span class="tag">${it.tag || ''}</span>${dateBadge}<p>${it.title || it.source || ''}</p>`;
    };
  } else {
    cell.className = 'cell text-fallback';
    cell.innerHTML = `<span class="tag">${it.tag || ''}</span>${dateBadge}<p>${it.title || it.source || ''}</p>`;
  }
  cell.onclick = () => openLightbox(it);
  return cell;
}

function renderGrid(items, container, opts) {
  const grid = document.createElement('div');
  grid.className = 'grid';
  items.forEach(it => grid.appendChild(buildCell(it, opts)));
  container.appendChild(grid);
}

function renderDayBlock(day) {
  const block = document.createElement('div');
  block.className = 'day-block';
  block.id = 'day-' + day.date;

  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `<span class="day-date">${dotDate(day.date)}</span><span class="day-count">${day.items.length}건</span>`;
  block.appendChild(header);

  if (day.quote) {
    const q = document.createElement('div');
    q.className = 'quote-card';
    q.innerHTML = `<p>“${day.quote.text}”</p><span>— ${day.quote.author}</span>`;
    block.appendChild(q);
  }

  renderGrid(day.items, block);
  feed.appendChild(block);
}

// ── 라이트박스: 확대 보기 + 원문 이동 ────────────────────────
function openLightbox(it) {
  if (it.file) {
    lightboxMedia.innerHTML = `<img src="${it.file}" alt="${it.title || ''}">`;
  } else {
    lightboxMedia.innerHTML = `<div class="lightbox-placeholder">${it.title || '카드 이미지가 없습니다'}</div>`;
  }
  lightboxTitle.textContent = it.title || '';
  lightboxMeta.textContent = [it.source, it.date ? dotDate(it.date) : null].filter(Boolean).join(' · ');
  if (it.url) {
    lightboxLink.href = it.url;
    lightboxLink.style.display = '';
  } else {
    lightboxLink.style.display = 'none';
  }
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }
lightboxClose.onclick = closeLightbox;
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

// ── '전체' 모드: 최신순 무한 스크롤 ─────────────────────────
let consecutiveFailures = 0;
const MAX_CONSECUTIVE_FAILURES = 2;

async function loadNextInAllMode() {
  if (mode !== 'all' || loadedIndex >= manifest.days.length) return;
  if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) return;
  const { date } = manifest.days[loadedIndex];
  loadedIndex++;
  try {
    const day = await fetchDay(date);
    renderDayBlock(day);
    consecutiveFailures = 0;
  } catch (e) {
    console.error('일자 데이터 로드 실패:', date, e);
    consecutiveFailures++;
    if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) showLoadMoreButton(date);
  }
}

function showLoadMoreButton(lastFailedDate) {
  const wrap = document.createElement('div');
  wrap.className = 'status-msg';
  wrap.innerHTML = `${dotDate(lastFailedDate)} 이전 날짜부터 데이터 파일이 없습니다.<br><span id="load-more-btn" style="cursor:pointer;text-decoration:underline;">다시 시도</span>`;
  feed.appendChild(wrap);
  document.getElementById('load-more-btn').onclick = () => {
    wrap.remove();
    consecutiveFailures = 0;
    loadNextInAllMode();
  };
}

async function resetAllMode() {
  mode = 'all';
  loadedIndex = 0;
  feed.innerHTML = '';
  for (let i = 0; i < INITIAL_BATCH; i++) await loadNextInAllMode();
}

const scrollObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting && mode === 'all') loadNextInAllMode(); });
}, { rootMargin: '400px 0px' });
scrollObserver.observe(sentinel);

// ── 특정 날짜만 보기 ─────────────────────────────────────
async function showSingleDay(date) {
  mode = 'single';
  showStatus('불러오는 중…');
  try {
    const day = await fetchDay(date);
    feed.innerHTML = '';
    renderDayBlock(day);
  } catch (e) {
    showStatus(`${dotDate(date)} 데이터를 불러올 수 없습니다.`, true);
  }
}

// ── 검색 ──────────────────────────────────────────────────
async function runSearch(query) {
  const q = query.trim();
  if (!q) { clearSearchUI(); await applyDateFilter(''); return; }

  mode = 'search';
  allBtn.classList.remove('active');
  calendarToggle.classList.remove('active');
  searchClear.style.display = '';
  showStatus('검색 중…');

  await Promise.all(manifest.days.map(d => fetchDay(d.date).catch(() => null)));

  const qLower = q.toLowerCase();
  const results = [];
  manifest.days.forEach(d => {
    const day = dayCache.get(d.date);
    if (!day) return;
    day.items.forEach(it => {
      if ((it.title || '').toLowerCase().includes(qLower)) {
        results.push({ ...it, date: d.date });
      }
    });
  });

  feed.innerHTML = '';
  totalCountEl.textContent = `'${q}' 검색결과 ${results.length}건`;

  if (results.length === 0) {
    showStatus(`'${q}'가 포함된 기사 제목이 없습니다.`);
    return;
  }

  const block = document.createElement('div');
  block.className = 'day-block';
  renderGrid(results, block, { showDateBadge: true });
  feed.appendChild(block);
}

function clearSearchUI() {
  searchInput.value = '';
  searchClear.style.display = 'none';
}

searchBtn.onclick = () => runSearch(searchInput.value);
searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(searchInput.value); });
searchClear.onclick = async () => { clearSearchUI(); await applyDateFilter(''); };

// ── 날짜 필터 (전체 / 특정일) ────────────────────────────────
async function applyDateFilter(dateValue) {
  clearSearchUI();
  selectedDate = dateValue;
  allBtn.classList.toggle('active', dateValue === '');
  calendarToggle.classList.toggle('active', dateValue !== '');
  calendarToggle.textContent = dateValue ? `📅 ${dotDate(dateValue)}` : '📅 날짜 선택';

  if (dateValue === '') {
    totalCountEl.textContent = `누적 ${manifest.total}건`;
    await resetAllMode();
  } else {
    const entry = manifest.days.find(d => d.date === dateValue);
    totalCountEl.textContent = `${dotDate(dateValue)} · ${entry ? entry.count : 0}건`;
    await showSingleDay(dateValue);
  }
}

allBtn.onclick = () => applyDateFilter('');

// ── 달력 팝업 ────────────────────────────────────────────────
function openCalendarPopup() {
  const base = selectedDate || (manifest.days[0] && manifest.days[0].date) || '2026-01-01';
  const [y, m] = base.split('-').map(Number);
  calendarView = { year: y, month: m };
  renderCalendar();
  calendarPopup.classList.add('active');
}
function closeCalendarPopup() { calendarPopup.classList.remove('active'); }

function renderCalendar() {
  const { year, month } = calendarView;
  calMonthLabel.textContent = `${year}년 ${month}월`;
  calDaysEl.innerHTML = '';

  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();

  for (let i = 0; i < firstWeekday; i++) {
    calDaysEl.appendChild(document.createElement('div'));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cell = document.createElement('div');
    cell.textContent = d;
    cell.className = 'cal-day';
    if (manifestDateSet.has(dateStr)) {
      cell.classList.add('has-data');
      if (dateStr === selectedDate) cell.classList.add('selected');
      cell.onclick = () => { applyDateFilter(dateStr); closeCalendarPopup(); };
    }
    calDaysEl.appendChild(cell);
  }
}

calendarToggle.onclick = () => {
  if (calendarPopup.classList.contains('active')) closeCalendarPopup();
  else openCalendarPopup();
};
calClose.onclick = closeCalendarPopup;
calPrev.onclick = () => {
  calendarView.month--;
  if (calendarView.month < 1) { calendarView.month = 12; calendarView.year--; }
  renderCalendar();
};
calNext.onclick = () => {
  calendarView.month++;
  if (calendarView.month > 12) { calendarView.month = 1; calendarView.year++; }
  renderCalendar();
};
document.addEventListener('click', (e) => {
  if (!calendarPopup.classList.contains('active')) return;
  if (calendarPopup.contains(e.target) || calendarToggle.contains(e.target)) return;
  closeCalendarPopup();
});

// ── 초기화 ────────────────────────────────────────────────
(async function init() {
  showStatus('불러오는 중…');
  try {
    manifest = await fetchJSON(`${DATA_DIR}/index.json`);
    manifest.days.sort((a, b) => b.date.localeCompare(a.date));
    manifestDateSet = new Set(manifest.days.map(d => d.date));
  } catch (e) {
    showStatus('데이터를 불러올 수 없습니다. data/index.json을 확인해주세요.', true);
    return;
  }

  if (!manifest.days.length) {
    showStatus('아직 등록된 데이터가 없습니다.');
    return;
  }

  totalCountEl.textContent = `누적 ${manifest.total}건`;
  feed.innerHTML = '';
  await resetAllMode();
})();
</script>

</body>
</html>
