<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITech 모니터링 피드</title>
<style>
  @font-face { font-family:'Pretendard'; font-weight:400;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2'); }
  @font-face { font-family:'Pretendard'; font-weight:600;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2'); }
  @font-face { font-family:'Pretendard'; font-weight:700;
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0e14; color:#f2f3f6; font-family:'Pretendard',-apple-system,sans-serif; }
  header {
    position: sticky; top:0; z-index:10; background:rgba(11,14,20,0.92); backdrop-filter: blur(8px);
    border-bottom:1px solid #22273a; padding:18px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-badge { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#60a5fa,#5eead4);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#0b0e14; font-size:15px; }
  .brand-name { font-weight:700; font-size:17px; }
  .brand-sub { font-size:12px; color:#8b93aa; }
  main { max-width:720px; margin:0 auto; padding:24px 12px 60px; }

  .date-filter {
    position: sticky; top: 71px; z-index: 9; background: rgba(11,14,20,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #22273a; padding: 10px 12px;
    display:flex; align-items:center; gap:8px;
  }
  .chip-scroll {
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0;
  }
  .chip-scroll::-webkit-scrollbar { display:none; }
  .date-chip, .calendar-select {
    flex: 0 0 auto; font-size:13px; font-weight:600; color:#8b93aa; background:#161b28;
    border:1px solid #262c3f; padding:7px 14px; border-radius:999px; cursor:pointer;
    white-space:nowrap; transition: all .15s ease;
  }
  .date-chip:hover { color:#d7dae4; border-color:#3a4258; }
  .date-chip.active, .calendar-select.active {
    color:#0b0e14; background:linear-gradient(135deg,#60a5fa,#5eead4); border-color:transparent;
  }
  .calendar-select {
    margin-left:2px; font-family:inherit; appearance:none; -webkit-appearance:none;
    padding:7px 10px;
  }
  .calendar-select option { background:#161b28; color:#f2f3f6; }

  .status-msg { text-align:center; color:#8b93aa; font-size:13px; padding:32px 12px; }
  .status-msg.error { color:#f87171; }

  .day-block { margin-bottom: 44px; }
  .day-header {
    display:flex; align-items:center; gap:10px; margin: 0 4px 14px;
  }
  .day-date { font-size:20px; font-weight:700; }
  .day-count { font-size:12px; color:#8b93aa; background:#161b28; border:1px solid #262c3f;
    padding:4px 10px; border-radius:999px; }

  .quote-card {
    background: linear-gradient(135deg,#141a2b,#0d1220); border:1px solid #232a40; border-radius:18px;
    padding:22px 22px; margin: 0 4px 14px;
  }
  .quote-card p { font-size:14px; line-height:1.6; color:#d7dae4; margin:0 0 8px; }
  .quote-card span { font-size:12px; color:#5eead4; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .cell { position:relative; aspect-ratio:4/5; overflow:hidden; cursor:pointer; background:#161b28; }
  .cell img { width:100%; height:100%; object-fit:cover; transition:transform .2s ease; }
  .cell:hover img { transform:scale(1.04); }
  .tag { position:absolute; top:8px; left:8px; font-size:10px; padding:3px 8px; border-radius:999px;
    background:rgba(0,0,0,0.55); color:#fff; font-weight:600; backdrop-filter: blur(2px); }

  .lightbox { display:none; position:fixed; inset:0; background:rgba(4,6,10,0.92); z-index:50;
    align-items:center; justify-content:center; padding:24px; }
  .lightbox.active { display:flex; }
  .lightbox img { max-width:420px; width:100%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .lightbox .close { position:absolute; top:20px; right:24px; font-size:28px; color:#fff; cursor:pointer;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center; }

  #scroll-sentinel { height:1px; }
  footer { text-align:center; color:#565d74; font-size:12px; padding:30px 0; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">M</div>
    <div>
      <div class="brand-name">MITech 모니터링</div>
      <div class="brand-sub">전략기획팀 데일리 브리핑</div>
    </div>
  </div>
  <div class="day-count" id="total-count"></div>
</header>

<nav class="date-filter">
  <div class="chip-scroll" id="chip-scroll"></div>
  <select class="calendar-select" id="calendar-select" style="display:none">
    <option value="">📅 이전 날짜</option>
  </select>
</nav>

<main>
  <div id="feed"></div>
  <div id="scroll-sentinel"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="close" onclick="closeLightbox()">✕</div>
  <img id="lightbox-img" src="" alt="">
</div>

<footer>MITech 전략기획팀 · 사내 공유용 · 매일 자동 업데이트</footer>

<script>
// ══════════════════════════════════════════════════════════════
// 데이터 소스: data/index.json (매니페스트) + data/<date>.json (일자별)
// 이 파일 자체는 데이터를 내장하지 않습니다. 매일 업데이트는
// data/<오늘날짜>.json 파일과 cards/<오늘날짜>/ 이미지 폴더를 추가하고
// data/index.json에 오늘 날짜 한 줄만 추가하면 됩니다.
//
// data/index.json 형식:
//   { "total": 485, "days": [ {"date":"2026-07-03","count":10}, ... ] }
//   (days는 최신 날짜가 배열 맨 앞에 오도록 정렬되어 있어야 함)
//
// data/<date>.json 형식:
//   { "date":"2026-07-03",
//     "quote": {"text":"...","author":"..."},   // 선택
//     "items": [ {"file":"cards/2026-07-03/01_x.png","tag":"업계",
//                 "title":"...","source":"...","url":"..."} ] }
// ══════════════════════════════════════════════════════════════

const RECENT_CHIP_COUNT = 7;      // 필터 바에 칩으로 노출할 최근 일수
const INITIAL_BATCH = 2;          // '전체' 모드 진입 시 처음에 바로 렌더링할 일수
const DATA_DIR = 'data';

const feed = document.getElementById('feed');
const chipScroll = document.getElementById('chip-scroll');
const calendarSelect = document.getElementById('calendar-select');
const totalCountEl = document.getElementById('total-count');
const sentinel = document.getElementById('scroll-sentinel');

let manifest = { total: 0, days: [] }; // { date, count }[], 최신순
let dayCache = new Map();              // date -> day JSON
let mode = 'all';                      // 'all' | 'single'
let loadedIndex = 0;                   // '전체' 모드에서 다음에 불러올 manifest 인덱스
let chips = [];

function dotDate(dashDate) {
  return dashDate.replaceAll('-', '.');
}

function showStatus(msg, isError = false) {
  feed.innerHTML = `<div class="status-msg${isError ? ' error' : ''}">${msg}</div>`;
}

async function fetchJSON(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path} (${res.status})`);
  return res.json();
}

async function fetchDay(date) {
  if (dayCache.has(date)) return dayCache.get(date);
  const data = await fetchJSON(`${DATA_DIR}/${date}.json`);
  dayCache.set(date, data);
  return data;
}

function renderDayBlock(day) {
  const block = document.createElement('div');
  block.className = 'day-block';
  block.id = 'day-' + day.date;

  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `<span class="day-date">${dotDate(day.date)}</span><span class="day-count">${day.items.length}건</span>`;
  block.appendChild(header);

  if (day.quote) {
    const q = document.createElement('div');
    q.className = 'quote-card';
    q.innerHTML = `<p>“${day.quote.text}”</p><span>— ${day.quote.author}</span>`;
    block.appendChild(q);
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  day.items.forEach(it => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<span class="tag">${it.tag}</span><img src="${it.file}" loading="lazy" alt="${it.title || ''}">`;
    cell.onclick = () => openLightbox(it.file);
    grid.appendChild(cell);
  });
  block.appendChild(grid);

  feed.appendChild(block);
}

// ── '전체' 모드: 최신순 무한 스크롤 ─────────────────────────
async function loadNextInAllMode() {
  if (mode !== 'all' || loadedIndex >= manifest.days.length) return;
  const { date } = manifest.days[loadedIndex];
  loadedIndex++;
  try {
    const day = await fetchDay(date);
    renderDayBlock(day);
  } catch (e) {
    console.error('일자 데이터 로드 실패:', date, e);
  }
}

async function resetAllMode() {
  mode = 'all';
  loadedIndex = 0;
  feed.innerHTML = '';
  for (let i = 0; i < INITIAL_BATCH; i++) {
    await loadNextInAllMode();
  }
}

const scrollObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && mode === 'all') loadNextInAllMode();
  });
}, { rootMargin: '400px 0px' });
scrollObserver.observe(sentinel);

// ── 특정 날짜만 보기 ─────────────────────────────────────
async function showSingleDay(date) {
  mode = 'single';
  showStatus('불러오는 중…');
  try {
    const day = await fetchDay(date);
    feed.innerHTML = '';
    renderDayBlock(day);
  } catch (e) {
    showStatus(`${dotDate(date)} 데이터를 불러올 수 없습니다.`, true);
  }
}

// ── 필터 UI ──────────────────────────────────────────────
function updateCountLabel(dateValue) {
  if (dateValue === '') {
    totalCountEl.textContent = `누적 ${manifest.total}건`;
  } else {
    const entry = manifest.days.find(d => d.date === dateValue);
    totalCountEl.textContent = `${dotDate(dateValue)} · ${entry ? entry.count : 0}건`;
  }
}

async function applyFilter(dateValue) {
  chips.forEach(c => c.classList.toggle('active', c.dataset.target === dateValue));
  const matchesChip = chips.some(c => c.dataset.target === dateValue);
  calendarSelect.classList.toggle('active', dateValue !== '' && !matchesChip);
  if (matchesChip || dateValue === '') calendarSelect.value = '';

  updateCountLabel(dateValue);

  if (dateValue === '') {
    await resetAllMode();
  } else {
    await showSingleDay(dateValue);
  }
}

function buildFilterBar() {
  const allChip = document.createElement('div');
  allChip.className = 'date-chip active';
  allChip.textContent = '전체';
  allChip.dataset.target = '';
  chipScroll.appendChild(allChip);

  const recentDays = manifest.days.slice(0, RECENT_CHIP_COUNT);
  const olderDays = manifest.days.slice(RECENT_CHIP_COUNT);

  recentDays.forEach(day => {
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = dotDate(day.date);
    chip.dataset.target = day.date;
    chipScroll.appendChild(chip);
  });

  if (olderDays.length > 0) {
    calendarSelect.style.display = '';
    olderDays.forEach(day => {
      const opt = document.createElement('option');
      opt.value = day.date;
      opt.textContent = dotDate(day.date);
      calendarSelect.appendChild(opt);
    });
  }

  chips = Array.from(chipScroll.querySelectorAll('.date-chip'));
  chips.forEach(chip => { chip.onclick = () => applyFilter(chip.dataset.target); });
  calendarSelect.onchange = (e) => { if (e.target.value) applyFilter(e.target.value); };
}

// ── 라이트박스 ────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});

// ── 초기화 ────────────────────────────────────────────────
(async function init() {
  showStatus('불러오는 중…');
  try {
    manifest = await fetchJSON(`${DATA_DIR}/index.json`);
    manifest.days.sort((a, b) => b.date.localeCompare(a.date)); // 최신순 보장
  } catch (e) {
    showStatus('데이터를 불러올 수 없습니다. data/index.json을 확인해주세요.', true);
    return;
  }

  if (!manifest.days.length) {
    showStatus('아직 등록된 데이터가 없습니다.');
    return;
  }

  buildFilterBar();
  totalCountEl.textContent = `누적 ${manifest.total}건`;
  feed.innerHTML = '';
  await resetAllMode();
})();
</script>

</body>
</html>
